name: Cloud cleanup watchdog

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      alert_test:
        description: 'Test the public failure alert without cloud credentials'
        type: boolean
        default: false

concurrency:
  group: cloud-cleanup-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline safety tests
        run: python3 -m unittest -q test_watchdog.py
      - name: Run project-scoped watchdog
        if: ${{ inputs.alert_test != true && vars.WATCHDOG_MODE == 'active' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TARGET_MANIFEST: ${{ secrets.TARGET_MANIFEST }}
        run: python3 watchdog.py
      - name: Exercise alert path
        if: ${{ inputs.alert_test == true }}
        run: exit 1
      - name: Open or update generic failure issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Cloud cleanup watchdog failure'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Cloud cleanup watchdog failure") | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "A watchdog run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Inspect and use the independent recovery procedure."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" --body "A watchdog run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Inspect and use the independent recovery procedure."
          fi

